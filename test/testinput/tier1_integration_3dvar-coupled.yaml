cost function:
  cost type: 3D-Var
  jb evaluation: false
  time window:
    begin: 2020-12-12T00:00:00Z
    length: P6D
  geometry: &geom
    FV3JEDI:
      fms initialization:
        namelist filename: data/fv3/input_c12.nml
        field table filename: data/fv3/field_table
      akbk: Data/inputs/fv3files/akbk127.nc4
      npx: 13
      npy: 13
      npz: 127
      ntiles: 6
    ocean:
      geometry_type: mom6
      ocean_hgrid: data_generated/mom6/ocean_hgrid.nc
      ocean_topog: data_generated/mom6/ocean_topog.nc
      vertical geometry from: data_generated/mom6/MOM.res.nc
      coarsen factor: 1
      has northern fold: true
      MOM_input:
        NIGLOBAL: 72
        NJGLOBAL: 35
        NZ: 25
        LAYOUT: [3, 2]
        MINIMUM_DEPTH: 0.5
    # Route the analysis variables to the correct component. The ocean (mist) has an
    # empty default variable list, so it must be told its variables explicitly. fv3-jedi's
    # default list is its whole metadata registry (which also contains the ocean fields),
    # so those must be excluded from the atmosphere to avoid a component-variable overlap.
    ocean include variables:
    - sea_water_potential_temperature
    - sea_water_salinity
    - sea_surface_height_above_geoid
    FV3JEDI exclude variables:
    - sea_water_potential_temperature
    - sea_water_salinity
    - sea_surface_height_above_geoid
  analysis variables:
  - eastward_wind
  - northward_wind
  - air_temperature
  - air_pressure_thickness
  - sea_water_potential_temperature
  - sea_water_salinity
  - sea_surface_height_above_geoid
  background:
    FV3JEDI:
      datetime: 2020-12-15T00:00:00Z
      filetype: fms restart
      datapath: Data/inputs/gfs_c12/bkg/
      filename_core: 20201215.000000.fv_core.res.nc
      filename_trcr: 20201215.000000.fv_tracer.res.nc
      filename_sfcd: 20201215.000000.sfc_data.nc
      filename_sfcw: 20201215.000000.fv_srf_wnd.res.nc
      filename_cplr: 20201215.000000.coupler.res
      state variables:
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_thickness
      field io names:
        eastward_wind: ua
        northward_wind: va
        air_temperature: T
        air_pressure_thickness: delp
    ocean:
      date: 2020-12-15T00:00:00Z
      state variables:
      - sea_water_salinity
      - sea_water_potential_temperature
      - sea_surface_height_above_geoid
      - sea_water_depth
      io:
        filetype: mom6
        datapath: data_generated/mom6
        ocn_file: MOM.res.nc
        fix_file: mom6_structuredgeometry_cache_grid.nc
        field io names:
          sea_water_potential_temperature: Temp
          sea_water_salinity: Salt
          sea_surface_height_above_geoid: ave_ssh
          sea_water_depth: sea_water_depth

  background error:
    covariance model: SABER coupled
    FV3JEDI:
      saber central block:
        saber block name: ID
    ocean:
      saber central block:
        saber block name: ID

  observations:
    observers:
#    - obs space:
#        name: SST
#        obsdatain:
#          engine:
#            type: H5File
#            obsfile: data_generated/obs/sst.nc
#        simulated variables: [seaSurfaceTemperature]
#      obs operator:
#        name: Identity
#        observation alias file: data/obs/obsop_name_map.yml
    - obs space:
        name: Aircraft
        obsdatain:
          engine:
            type: H5File
            obsfile: data_generated/obs/aircraft.nc
        simulated variables:
        - windEastward
        - windNorthward
        - airTemperature
      obs operator:
        name: Identity
        vertical coordinate: air_pressure
        observation vertical coordinate: pressure
        observation vertical coordinate group: MetaData
        interpolation method: log-linear

variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - geometry: *geom
    ninner: 3
    gradient norm reduction: 1e-8
    test: on

#output:
#  io:
#    filetype: unstructured
#    filepath: coupled-3dvar-an-unstructured

final j evaluation: false

