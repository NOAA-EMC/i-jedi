# LETKF with the SQG model state on its doubly periodic domain, represented as the 64x64
# equatorial lon/lat patch of tier1_integration_forecast-sqg.yaml (0.5 deg spacing, period
# 32 deg in both directions). The horizontal localization uses the periodic distance with
# these periods, so that observations near an edge also update the opposite edge; all
# observations are on all tasks (InefficientDistribution).
# Lengths are in metres on the patch: one SQG grid cell (312.5 km for L = 20000 km) is
# 0.5 deg = 55.6 km, i.e. SQG lengths times 0.178.
# Ensemble, truth and observations (potential temperature at randomly selected grid points on
# the lower boundary and on the lid) are generated by tools/gen_sqg_da_testdata.py.
# Writing SQG files needs a single MPI task.
geometry:
  geometry_type: atlas
  nlevels: 2
  levels are top down: false
  vertical coordinate source: level index
  function space: StructuredColumns
  partitioner: checkerboard
  grid:
    type: regional
    nx: 64
    ny: 64
    west: 0.0
    east: 31.5
    south: -15.75
    north: 15.75

time window:
  begin: 2014-12-31T21:00:00Z
  length: PT6H

local ensemble DA:
  solver: Deterministic LETKF
  use linear observer: true
  inflation:
    rtps: 0.0
    rtpp: 0.0
    mult: 1.0

driver:
  update obs config with geometry info: false
  do test prints: true
  read HX from disk: false
  run as observer only: false
  save posterior ensemble: false
  save posterior mean: true
  save prior mean: true
  save posterior mean increment: true

analysis variables: [air_potential_temperature]

background:
  date: 2015-01-01T00:00:00Z
  members from template:
    template:
      date: 2015-01-01T00:00:00Z
      state variables: [air_potential_temperature]
      io:
        filetype: sqg
        filename: data_generated/sqg/ens_mem%mem%.nc
        time index: 0
    pattern: '%mem%'
    nmembers: 10
    zero padding: 3

# Obs sit on grid points; the nn fill only guards against points on the domain edge
# being found just outside the mesh due to round-off.
# The GeoVaLs seen by the Identity operator are ordered top down (the model levels are
# bottom up), so its default (last GeoVaL level) is the lower boundary, and
# "level index 0 is closest to surface: true" makes it use GeoVaL level 0, i.e. the lid.
# Each column (both boundaries) is updated by the obs on both boundaries.
observations:
  observers:
  - obs space:
      name: SQGLowerBoundary
      obsdatain:
        engine:
          type: H5File
          obsfile: data_generated/sqg/obs_sqg_bottom.nc
      simulated variables: [potentialTemperature]
      distribution:
        name: InefficientDistribution
    obs operator:
      name: Identity
    get values:
      regional nn fill distance in km: 1
    obs localizations: &loc
    - localization method: Horizontal Gaspari-Cohn
      lengthscale: 600e3  # GC99 support (m): ~11 grid cells
      distance type: periodic
      search method: brute_force
      longitude period: 32.0
      latitude period: 32.0
  - obs space:
      name: SQGLid
      obsdatain:
        engine:
          type: H5File
          obsfile: data_generated/sqg/obs_sqg_lid.nc
      simulated variables: [potentialTemperature]
      distribution:
        name: InefficientDistribution
    obs operator:
      name: Identity
      level index 0 is closest to surface: true
    get values:
      regional nn fill distance in km: 1
    obs localizations: *loc

output:
  io:
    filetype: sqg
    filename: letkf-sqg-an.nc

output mean prior:
  io:
    filetype: sqg
    filename: letkf-sqg-bg.nc

output increment:
  io:
    filetype: sqg
    filename: letkf-sqg-inc.nc

test:
  reference filename: testref/letkf-sqg.test
  test output filename: letkf-sqg.test
