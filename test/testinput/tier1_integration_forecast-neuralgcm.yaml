# A NeuralGCM forecast run through i-jedi, on NeuralGCM's own native grid.
#
# The grid is not an approximation of the model's: atlas's regular_gaussian N=32 and
# NeuralGCM's TL63 agree to 3e-14 degrees, so nothing is interpolated anywhere between the
# file, the state and the model.
#
# The point of the test is the comparison with testref, which was produced by a rollout that
# ran entirely in Python and never went through the C++ bridge. A forecast that merely
# completes proves the plumbing does not crash; one that reproduces the reference proves the
# marshalling preserves the model's answer - including the latitude flip and the
# longitude/latitude transpose between atlas's ordering and NeuralGCM's, which are the errors
# that would otherwise pass unnoticed because the result still looks like weather.
geometry:
  geometry_type: atlas
  function space: StructuredColumns
  grid:
    type: regular_gaussian
    N: 32
  levels are top down: true
  vertical levels: [100, 200, 300, 500, 700, 1000, 2000, 3000, 5000, 7000,
                    10000, 12500, 15000, 17500, 20000, 22500, 25000, 30000,
                    35000, 40000, 45000, 50000, 55000, 60000, 65000, 70000,
                    75000, 77500, 80000, 82500, 85000, 87500, 90000, 92500,
                    95000, 97500, 100000]

model:
  name: PythonModel
  adapter: neuralgcm
  backend: subprocess
  time step: PT6H
  adapter config:
    checkpoint: demo
    rng seed: 0

initial condition:
  date: 1959-01-02T00:00:00Z
  state variables: &vars
  - eastward_wind
  - northward_wind
  - air_temperature
  - geopotential
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_liquid_water
  - cloud_liquid_ice
  - sea_surface_temperature
  - sea_ice_area_fraction
  io:
    filetype: structured netcdf
    filepath: data_generated/neuralgcm/neuralgcm_ic_tl63.nc
    field io names: &names
      eastward_wind: u_component_of_wind
      northward_wind: v_component_of_wind
      air_temperature: temperature
      geopotential: geopotential
      water_vapor_mixing_ratio_wrt_moist_air: specific_humidity
      cloud_liquid_water: specific_cloud_liquid_water_content
      cloud_liquid_ice: specific_cloud_ice_water_content
      sea_surface_temperature: sea_surface_temperature
      sea_ice_area_fraction: sea_ice_cover

model aux control: {}
forecast length: PT6H

prints:
  frequency: PT6H

output:
  frequency: PT6H
  io:
    filetype: structured netcdf
    filepath: forecast-neuralgcm-tl63.nc
    datetime: 1959-01-02T06:00:00Z
    field io names: *names

test:
  reference filename: testref/forecast-neuralgcm.test
