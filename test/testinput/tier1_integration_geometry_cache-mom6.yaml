geometry:
  geometry_type: mom6
  ocean_hgrid: data_generated/mom6/ocean_hgrid.nc
  ocean_topog: data_generated/mom6/ocean_topog.nc
  vertical geometry from: data_generated/mom6/MOM.res.nc
  coarsen factor: 1
  has northern fold: true
  save unstructured grid to: data_generated/mom6/mom6_unstructuredgeometry_cache_grid.nc
  save structured grid to: data_generated/mom6/mom6_structuredgeometry_cache_grid.nc

  MOM_input:
    NIGLOBAL: 72
    NJGLOBAL: 35
    NZ: 25
    LAYOUT: [3, 2]
    MINIMUM_DEPTH: 0.5
