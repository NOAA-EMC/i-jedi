input geometry:
  geometry_type: mom6
  ocean_hgrid: data_generated/mom6/ocean_hgrid.nc
  ocean_topog: data_generated/mom6/ocean_topog.nc
  vertical geometry from: data_generated/mom6/MOM.res.nc
  coarsen factor: 1
  MOM_input:
    NIGLOBAL: 72
    NJGLOBAL: 35
    NZ: 25
    LAYOUT: [3, 2]
    MINIMUM_DEPTH: 0.5

output geometry:
  geometry_type: ww3
  mesh file: data_generated/ww3/ww3_test.msh

states:
- input: &input
    date: 2021-01-01T00:00:00Z
    state variables: &vars
    - sea_surface_height_above_geoid
    - sea_ice_area_fraction
    io:
      filetype: mom6
      datapath: data_generated/mom6
      ocn_file: MOM.res.nc
      ice_file: cice6.nc
      field io names:
        sea_surface_height_above_geoid: ave_ssh
        sea_ice_area_fraction: aice_h
  output:
    date: 2021-01-01T00:00:00Z
    state variables: *vars
    io:
      filetype: ww3
      datapath: data_generated/ww3
      filename: mom6_to_ww3.nc
      field io names:
        sea_surface_height_above_geoid: ssh
        sea_ice_area_fraction: ice
- input: *input
  output:
    date: 2021-01-01T00:00:00Z
    state variables: *vars
    io:
      filetype: gmsh
      filename: mom6_to_ww3.msh
