# 3DVar with the SQG model state on its doubly periodic domain, represented as the 64x64
# equatorial lon/lat patch of tier1_integration_forecast-sqg.yaml (0.5 deg spacing, period
# 32 deg in both directions). The background error correlations are computed with FFTs on
# the patch (bi-Fourier), so they wrap around both domain edges.
# Lengths are in metres on the patch: one SQG grid cell (312.5 km for L = 20000 km) is
# 0.5 deg = 55.6 km, i.e. SQG lengths times 0.178.
# Observations of potential temperature at randomly selected grid points on the lower
# boundary and on the lid, from a truth generated by tools/gen_sqg_3dvar_testdata.py.
# Writing SQG files needs a single MPI task.
cost function:
  cost type: 3D-Var
  jb evaluation: false
  time window:
    begin: 2014-12-31T21:00:00Z
    length: PT6H
  geometry: &geom
    geometry_type: atlas
    nlevels: 2
    levels are top down: false
    vertical coordinate source: level index
    function space: StructuredColumns
    partitioner: checkerboard
    grid:
      type: regional
      nx: 64
      ny: 64
      west: 0.0
      east: 31.5
      south: -15.75
      north: 15.75
  analysis variables: [air_potential_temperature]
  background:
    date: 2015-01-01T00:00:00Z
    state variables: [air_potential_temperature]
    io:
      filetype: sqg
      filename: data_generated/sqg/sqg_ic.nc
      time index: 0

  # Level 0 = lower boundary, level 1 = lid; no vertical correlation between them
  background error:
    covariance model: SABER
    saber central block:
      saber block name: BifourierCovariance
      profiles:
      - variable: air_potential_temperature
        horizontal length-scales: [400.0e3, 400.0e3]  # GC99 support (m): ~7 grid cells
        standard-deviation: [1.0, 1.0]  # K
    saber outer blocks:
    - saber block name: BifourierSpectralToGrid

  # Obs sit on grid points; the nn fill only guards against points on the domain edge
  # being found just outside the mesh due to round-off.
  # The GeoVaLs seen by the Identity operator are ordered top down (the model levels are
  # bottom up), so its default (last GeoVaL level) is the lower boundary, and
  # "level index 0 is closest to surface: true" makes it use GeoVaL level 0, i.e. the lid.
  observations:
    observers:
    - obs space:
        name: SQGLowerBoundary
        obsdatain:
          engine:
            type: H5File
            obsfile: data_generated/sqg/obs_sqg_bottom.nc
        simulated variables: [potentialTemperature]
      obs operator:
        name: Identity
      get values:
        regional nn fill distance in km: 1
    - obs space:
        name: SQGLid
        obsdatain:
          engine:
            type: H5File
            obsfile: data_generated/sqg/obs_sqg_lid.nc
        simulated variables: [potentialTemperature]
      obs operator:
        name: Identity
        level index 0 is closest to surface: true
      get values:
        regional nn fill distance in km: 1

variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - geometry: *geom
    ninner: 20
    gradient norm reduction: 1e-10
    test: on

output:
  io:
    filetype: sqg
    filename: 3dvar-sqg-an.nc

final:
  increment:
    output:
      state component:
        io:
          filetype: sqg
          filename: 3dvar-sqg-inc.nc

final j evaluation: false

test:
  reference filename: testref/3dvar-sqg.test
  test output filename: 3dvar-sqg.test
