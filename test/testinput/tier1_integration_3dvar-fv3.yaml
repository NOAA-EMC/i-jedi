cost function:
  cost type: 3D-Var
  analysis variables: &3dvars
  - eastward_wind
  - northward_wind
  - air_temperature
  - air_pressure_at_surface
  time window:
    begin: 2020-12-14T21:00:00Z
    length: PT6H
  geometry: &geometry
    fms initialization:
      namelist filename: data/fv3/input_c12.nml
      field table filename: data/fv3/field_table
    geometry_type: fv3
    npx: 13
    npy: 13
    npz: 127
    ntiles: 6
    akbk: gfs_127
  background:
    date: 2020-12-15T00:00:00Z
    io:
      filetype: fv3
      source: history
      datapath: data_generated/fv3/
      atm_file: atmf006.nc
      field io names:
        eastward_wind: ugrd
        northward_wind: vgrd
        air_temperature: tmp
        air_pressure_thickness: dpres
        air_pressure_at_surface: pressfc
    state variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_thickness
    - air_pressure_at_surface
  background error:
    covariance model: SABER
    saber central block:
      saber block name: gsi static covariance
      read:
        gsi akbk: data/akbk127.nc4
        gsi error covariance file: data/gsi-coeffs-gfs-global-l127x192y96.nc4
        gsi berror namelist file: data/gfs_gsi_global_192x96x127.nml
        processor layout x direction: 3
        processor layout y direction: 2
        debugging mode: false
    saber outer blocks:
    - saber block name: interpolation
      inner geometry:
        function space: StructuredColumns
        custom grid matching gsi:
          type: gaussian
          lats: 96
          lons: 192
        custom partitioner matching gsi:
          bands: 2
        halo: 1
      forward interpolator:
        local interpolator type: oops unstructured grid interpolator
      inverse interpolator:
        local interpolator type: oops unstructured grid interpolator
      state variables to inverse:
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_at_surface
  observations:
    observers:
    - obs space:
        name: Aircraft
        obsdatain:
          engine:
            type: H5File
            obsfile: data_generated/obs/aircraft.nc
        simulated variables:
        - windEastward
        - windNorthward
        - airTemperature
      obs operator:
        name: Identity #VertInterp   # switch to Identity until I/O is ready: VertInterp doesn't like uninit or zero values in vert coord
        vertical coordinate: air_pressure
        observation vertical coordinate: pressure
        observation vertical coordinate group: MetaData
        interpolation method: log-linear
output:
  io:
    filetype: unstructured
    filepath: fv3-3dvar

variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - ninner: 5
    gradient norm reduction: 1e-10
    geometry: *geometry

test:
  reference filename: testref/3dvar_fv3.ref
  test output filename: testoutput/3dvar_fv3.out
