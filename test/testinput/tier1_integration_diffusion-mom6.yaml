geometry: &geom
  geometry_type: mom6
  ocean_hgrid: data_generated/mom6/ocean_hgrid.nc
  ocean_topog: data_generated/mom6/ocean_topog.nc
  vertical geometry from: data_generated/mom6/MOM.res.nc
  coarsen factor: 1
  has northern fold: true
  MOM_input:
    NIGLOBAL: 72
    NJGLOBAL: 35
    NZ: 25
    LAYOUT: [2, 1]
    MINIMUM_DEPTH: 0.5

background:
  date: 2020-12-16T00:00:00Z
  state variables:
  - sea_water_salinity
  - sea_water_potential_temperature
  - sea_surface_height_above_geoid
  io:
    filetype: mom6
    filename: data_generated/mom6/MOM.res.nc
    field io names:
      sea_water_potential_temperature: Temp
      sea_water_salinity: Salt
      sea_surface_height_above_geoid: ave_ssh

background error:
  covariance model: SABER
  saber central block:
    saber block name: diffusion
    calibration:
      normalization:
        iterations: 1000
      groups:
      - horizontal:
          fixed value: 500000.0    # 500 km Gaussian sigma
          as gaussian: true
        write:
          filepath: diffusion_hz
      - vertical:
          fixed value: 2.0         # 2 levels Gaussian sigma
          levels: 25
          as gaussian: true
        write:
          filepath: diffusion_vt
