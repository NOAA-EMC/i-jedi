geometry: &geom
  geometry_type: fv3
  fms initialization:
    namelist filename: data/fv3/input_c12_1tile.nml
    field table filename: data/fv3/field_table
  namelist filename: data/fv3/input_c12_1tile.nml
  npx: 13
  npy: 13
  npz: 127
  ntiles: 1
  akbk: gfs_127

time window:
  begin: 2020-12-14T21:00:00Z
  length: PT6H

local ensemble DA:
  solver: Deterministic LETKF
  use linear observer: true
  inflation:
    rtps: 0.95
    rtpp: 0.0
    mult: 1.0

driver:
  update obs config with geometry info: false
  do test prints: false
  read HX from disk: false
  run as observer only: true
  save posterior mean: true
  save prior mean: true

analysis variables:
  - air_temperature

background:
  date: 2020-12-15T00:00:00Z
  members from template:
    template:
      date: 2020-12-15T00:00:00Z
      state variables:
        - air_temperature
      io:
        filetype: fv3 restart
        datapath: data_generated/fv3/
        filename_core: fv_core.res.tile1_mem%mem%.nc
        filename_trcr: fv_tracer.res.tile1_mem%mem%.nc
        filename_sfcd: sfc_data.res.tile1_mem%mem%.nc
        filename_sfcw: fv_srf_wnd.res.tile1_mem%mem.nc
        filename_cplr: coupler.res
        field io names:
         air_temperature: T
    pattern: '%mem%'
    nmembers: 3
    zero padding: 3

observations:
  observers:
    - obs space:
        name: Aircraft
        obsdatain:
         engine:
           type: H5File
           obsfile: data_generated/obs/aircraft.nc
        obsdataout:
         engine:
           type: H5File
           obsfile: data_generated/obs/jdiag_aircraft.nc
        simulated variables:
         - airTemperature
        distribution:
          name: RoundRobin
          halo size: 2000e3
      obs operator:
        name: Identity
        observation alias file: data/obs/obsop_name_map.yml
      obs localizations: 
      - localization method: Horizontal Gaspari-Cohn
        lengthscale: 2000e3

output:
  io:
    filetype: fv3 restart
    filename_core: fv_core.res.tile1-an.nc
    filename_trcr: fv_tracer.res.tile1-an.nc
    filename_sfcd: sfc_data.res.tile1-an.nc
    filename_sfcw: fv_srf_wnd.res.tile1-an.nc

output mean prior:
  io:
    filetype: fv3 restart
    filename_core: fv_core.res.tile1-an.nc
    filename_trcr: fv_tracer.res.tile1-an.nc
    filename_sfcd: sfc_data.res.tile1-an.nc
    filename_sfcw: fv_srf_wnd.res.tile1-an.nc
