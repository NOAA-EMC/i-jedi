input geometry:
  geometry_type: mom6
  ocean_hgrid: data_generated/mom6/ocean_hgrid.nc
  ocean_topog: data_generated/mom6/ocean_topog.nc
  vertical geometry from: data_generated/mom6/MOM.res.nc
  coarsen factor: 1
  MOM_input:
    NIGLOBAL: 72
    NJGLOBAL: 35
    NZ: 25
    LAYOUT: [3, 2]
    MINIMUM_DEPTH: 0.5

output geometry:
  geometry_type: fv3
  fms initialization:
    namelist filename: data/fv3/input_c12.nml
    field table filename: data/fv3/field_table
  npx: 13
  npy: 13
  npz: 127
  ntiles: 6
  akbk: gfs_127

states:
- input:
    date: 2020-12-15T00:00:00Z
    state variables:
    - sea_water_potential_temperature
    - sea_water_salinity
    - sea_surface_height_above_geoid
    io:
      filetype: mom6
      datapath: data_generated/mom6
      ocn_file: MOM.res.nc
      field io names:
        sea_water_potential_temperature: Temp
        sea_water_salinity: Salt
        sea_surface_height_above_geoid: ave_ssh
  output:
    date: 2020-12-15T00:00:00Z
    state variables:
    - sea_water_potential_temperature
    - sea_water_salinity
    - sea_surface_height_above_geoid
    io:
      filetype: fv3 history
      datapath: data_generated/
      atm_file: mom6_to_fv3_converted.atmf006.nc
      sfc_file: mom6_to_fv3_converted.sfcf006.nc
      field io names:
        sea_water_potential_temperature: Temp
        sea_water_salinity: Salt
        sea_surface_height_above_geoid: ave_ssh

