name: Run all CI tests
on: [pull_request]

jobs:
  run_all_tests:
    runs-on: ubuntu-latest
    name: Full CI (style and tests)
    container:
      image: ghcr.io/noaa-emc/gdasapp:latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        path: i-jedi
        submodules: recursive
    - name: Run ecbuild
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE
        mkdir -p Build
        cd Build
        ecbuild -DMPI_ARGS="--map-by :OVERSUBSCRIBE" ../i-jedi/bundle
        cd ../i-jedi/bundle
    # - name: Run coding style checks
    #   shell: bash
    #   run: |
    #     su - nonroot
    #     export jedi_cmake_ROOT=/opt/view
    #     source /opt/spack-environment/activate.sh
    #     cd $GITHUB_WORKSPACE/Build/ijedi
    #     ctest -R coding_norms --output-on-failure
    - name: Compile the code
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE
        rm -rf Build
        mkdir -p Build
        cd Build
        export LIBRARY_PATH=/opt/jedi/lib:/opt/views/view/lib:$LIBRARY_PATH
        export LD_LIBRARY_PATH=/opt/jedi/lib:/opt/views/view/lib:$LD_LIBRARY_PATH
        ecbuild -DMPI_ARGS="--map-by :OVERSUBSCRIBE"  -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install -DCMAKE_PREFIX_PATH="/opt/views/view;/opt/jedi"   -DNetCDF_ROOT=/opt/views/view   -Dsp_DIR=/opt/views/view/lib/cmake/sp   -DSP_DIR=/opt/views/view/lib/cmake/sp   -DCMAKE_INSTALL_PREFIX="~/install"   -DBUILD_JEDI="OFF" ../i-jedi/bundle
        make -j4
        make install
    - name: Run coding style checks
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE/Build/ijedi
        ctest -R coding_norms --output-on-failure
    - name: Run ctests
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE/Build/ijedi
        export OMPI_ALLOW_RUN_AS_ROOT=1
        export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
        ctest --rerun-failed --output-on-failure --allow-run-as-root
