name: Run all CI tests
on: [pull_request]

jobs:
  run_all_tests:
    runs-on: ubuntu-latest
    name: Full CI (style and tests)
    container: jcsda/docker-gnu-openmpi-dev:1.9
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        path: i-jedi
        submodules: recursive
    - name: Run ecbuild
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE
        mkdir -p Build
        cd Build
        ecbuild -DMPI_ARGS="--map-by :OVERSUBSCRIBE" ../i-jedi/bundle
        cd ../i-jedi/bundle
    - name: Cache install of JEDI libraries
      id: cache-jedi
      uses: actions/cache@v5
      with:
        path: |
          ${{ github.workspace }}/install
        key: ${{ runner.os }}-jedi
    - name: Run coding style checks
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE/Build/ijedi
        ctest -R coding_norms --output-on-failure
    - name: Debug - check oops install
      run: |
          echo "========== did install/include get populated? =========="
          find /__w/i-jedi/i-jedi/install/include -type f 2>/dev/null | head -20 || echo "empty or missing"
          echo ""
          echo "========== find mist source in the build tree =========="
          find /__w/i-jedi/i-jedi -path "*/mist/base/Geometry.h" 2>/dev/null || echo "no mist source found"
          echo ""
          echo "========== find mist CMakeLists =========="
          find /__w/i-jedi/i-jedi -name "CMakeLists.txt" -exec grep -l "mist" {} \; 2>/dev/null || echo "no CMakeLists mention mist"
          echo ""
          echo "========== check if oops install ran =========="
          find /__w/i-jedi/i-jedi/install -name "liboops*" 2>/dev/null || echo "no liboops found in install"
    - name: Compile the code without any cache
      if: steps.cache-jedi.outputs.cache-hit != 'true'
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE
        rm -rf Build
        mkdir -p Build
        cd Build
        ecbuild -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install -DMPI_ARGS="--map-by :OVERSUBSCRIBE" ../i-jedi/bundle 
        make -j4
        make install
    - name: Compile the code with cache
      if: steps.cache-jedi.outputs.cache-hit == 'true'
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE
        rm -rf Build
        chmod +x $GITHUB_WORKSPACE/i-jedi/.github/workflows/fix_circular_dependency.sh
        $GITHUB_WORKSPACE/i-jedi/.github/workflows/fix_circular_dependency.sh $GITHUB_WORKSPACE/install
        mkdir -p Build
        cd Build
        ecbuild -DMPI_ARGS="--map-by :OVERSUBSCRIBE" -DBUILD_JEDI=OFF -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/install -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install ../i-jedi/bundle 
        cd ijedi
        make -j4
    - name: Run ctests
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE/Build/ijedi
        export OMPI_ALLOW_RUN_AS_ROOT=1
        export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
        ctest --rerun-failed --output-on-failure --allow-run-as-root
