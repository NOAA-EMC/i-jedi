name: Run all CI tests
on: [pull_request]

jobs:
  run_all_tests:
    runs-on: ubuntu-latest
    name: Full CI (style and tests)
    container: jcsda/docker-gnu-openmpi-dev:1.9
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        path: i-jedi
        submodules: recursive
    - name: Cache OOPS
      id: cache-oops
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/Build/lib/liboops.so
        key: ${{ runner.os }}-oops
    - name: Cache VADER
      id: cache-vader
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/Build/lib/libvader.so
        key: ${{ runner.os }}-vader
    - name: Cache UFO
      id: cache-ufo
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/Build/lib/libufo.so
        key: ${{ runner.os }}-ufo
    - name: Cache IODA
      id: cache-ioda
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/Build/lib/libioda.so
        key: ${{ runner.os }}-ioda
    - name: Run ecbuild
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE
        mkdir -p Build
        cd Build
        export IJEDI_MPI_ARGS="--map-by :OVERSUBSCRIBE"
        ecbuild ../i-jedi/bundle
    - name: Run coding style checks
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE/Build/ijedi
        ctest -R coding_norms --output-on-failure        
    - name: Compile the code
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE/Build/ijedi
        make -j4
    - name: Run ctests
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE/Build/ijedi
        export OMPI_ALLOW_RUN_AS_ROOT=1
        export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
        ctest --rerun-failed --output-on-failure --allow-run-as-root
