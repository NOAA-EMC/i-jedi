name: Run all CI tests
on: [pull_request]

jobs:
  run_all_tests:
    runs-on: ubuntu-latest
    name: Full CI (style and tests)
    container: jcsda/docker-gnu-openmpi-dev:1.9
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        path: i-jedi
        submodules: recursive
    - name: Run ecbuild
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE
        mkdir -p Build
        cd Build
        ecbuild -DMPI_ARGS="--map-by :OVERSUBSCRIBE" ../i-jedi/bundle
    - name: Cache install of JEDI libraries
      id: cache-jedi
      uses: actions/cache@v5
      with:
        path: |
          ${{ github.workspace }}/install
        key: ${{ runner.os }}-jedi
    - name: Run coding style checks
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE/Build/ijedi
        ctest -R coding_norms --output-on-failure        
    - name: Compile the code without any cache
      if: steps.cache-jedi.outputs.cache-hit != 'true'
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE
        rm -rf Build
        mkdir -p Build
        cd Build
        ecbuild -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install -DMPI_ARGS="--map-by :OVERSUBSCRIBE" ../i-jedi/bundle 
        cd ijedi
        make -j4
    - name: Compile the code with cache
      if: steps.cache-jedi.outputs.cache-hit == 'true'
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE
        rm -rf Build
        mkdir -p Build
        cd Build
        ecbuild -DMPI_ARGS="--map-by :OVERSUBSCRIBE" -DBUILD_JEDI=OFF -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/install -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install ../i-jedi/bundle 
        cd ijedi
        make -j4
    - name: Run ctests
      shell: bash
      run: |
        su - nonroot
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE/Build/ijedi
        export OMPI_ALLOW_RUN_AS_ROOT=1
        export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
        ctest --rerun-failed --output-on-failure --allow-run-as-root
