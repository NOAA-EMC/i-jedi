name: Run all CI tests
on: [pull_request]

jobs:
  run_all_tests:
    runs-on: ubuntu-latest
    name: Full CI (style and tests)
    container: ghcr.io/noaa-emc/i-jedi:latest
    steps:
    # needed as this container is missing ssh somehow
    - name: Install SSH client
      run: apt-get update && apt-get install -y --no-install-recommends openssh-client git
    - name: Checkout
      uses: actions/checkout@v2
      with:
        path: i-jedi
        submodules: recursive
        ssh-key: ${{ secrets.JCSDA_MIST_KEY }}
    # Checkout mist from jcsda-internal
    - name: checkout-mist
      uses: actions/checkout@v6
      with:
        repository: "JCSDA-internal/mist"
        ref: "develop" # Specify your branch here
        path: i-jedi/bundle/mist
        ssh-key: ${{ secrets.JCSDA_MIST_KEY }}
    - name: Give nonroot the workspace
      run: chown -R nonroot "$GITHUB_WORKSPACE"
    - name: Run ecbuild
      shell: bash
      run: |
        su - nonroot <<EOF
        whoami
        set -e
        source /etc/spack_container_rc.sh
        load_jedi_bundle_env
        cd $GITHUB_WORKSPACE
        mkdir -p Build
        cd Build
        ecbuild -DMPI_ARGS='--map-by :OVERSUBSCRIBE' -DCLONE_MIST='OFF' -DBUNDLE_SKIP_ATLAS=ON ../i-jedi/bundle
        EOF
    - name: Check container libraries
      id: check-container
      shell: bash
      run: |
        git config --global --add safe.directory '*'
        MATCH=true
        if [ -f /opt/jedi/etc/jedi_repo_hashes.txt ]; then
          for d in $GITHUB_WORKSPACE/i-jedi/bundle/*; do
            if [ -d "$d/.git" ]; then
              REPO=$(basename $d)
              if [[ "$REPO" == "ijedi" || "$REPO" == "mist" || "$REPO" == "atlas" ]]; then
                continue
              fi
              CURRENT_SHA=$(git -C $d rev-parse HEAD)
              CONTAINER_SHA=$(grep "^$REPO " /opt/jedi/etc/jedi_repo_hashes.txt | cut -d' ' -f2 || true)
              if [ "$CURRENT_SHA" != "$CONTAINER_SHA" ]; then
                echo "$REPO has changed ($CONTAINER_SHA -> $CURRENT_SHA)"
                MATCH=false
              fi
            fi
          done
        else
          echo "No hash file found in container."
          MATCH=false
        fi
        echo "match=$MATCH" >> $GITHUB_OUTPUT
        
        # Also generate a hash for caching if container doesn't match
        HASH=$(find $GITHUB_WORKSPACE/i-jedi/bundle -maxdepth 2 -name .git -type d | sort | xargs -I {} git -C {}/.. rev-parse HEAD | sha256sum | awk '{print $1}')
        echo "hash=$HASH" >> $GITHUB_OUTPUT
    - name: Run coding style checks
      shell: bash
      run: |
        su - nonroot <<EOF
        set -e
        source /etc/spack_container_rc.sh
        load_jedi_bundle_env
        cd $GITHUB_WORKSPACE/Build/ijedi
        ctest -R coding_norms --output-on-failure
        EOF
    - name: Compile the code without using container libraries
      if: steps.check-container.outputs.match == 'false'
      shell: bash
      run: |
        su - nonroot <<EOF
        set -e
        source /etc/spack_container_rc.sh
        load_jedi_bundle_env
        cd $GITHUB_WORKSPACE
        rm -rf Build
        mkdir -p Build
        cd Build
        ecbuild -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install -DBUNDLE_SKIP_ATLAS=ON -DMPI_ARGS="--map-by :OVERSUBSCRIBE" ../i-jedi/bundle 
        make -j4
        make install
        EOF
    - name: Compile the code with container libraries
      if: steps.check-container.outputs.match == 'true'
      shell: bash
      run: |
        echo "Libaries are installed"
        ls -l /opt/jedi
        su - nonroot <<EOF
        set -e
        source /etc/spack_container_rc.sh
        load_jedi_bundle_env
        cd $GITHUB_WORKSPACE
        rm -rf Build
        mkdir -p Build
        cd Build
        ls -l /opt/jedi
        ls -l /opt/jedi/lib
        ls -l /opt/jedi/include
        ls -l /opt/jedi/bin
        ecbuild -DMPI_ARGS="--map-by :OVERSUBSCRIBE" -DBUILD_JEDI=OFF -DCMAKE_PREFIX_PATH=/opt/jedi -DBUNDLE_SKIP_ATLAS=ON -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install ../i-jedi/bundle 
        cd ijedi
        make -j4
        EOF
    - name: Run ctests
      shell: bash
      run: |
        su - nonroot <<EOF
        set -e
        source /etc/spack_container_rc.sh
        load_jedi_bundle_env
        cd $GITHUB_WORKSPACE/Build/ijedi
        ctest --rerun-failed --output-on-failure --timeout 300
        EOF
