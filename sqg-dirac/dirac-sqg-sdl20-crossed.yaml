# Dirac test of the scale-dependent localized ensemble covariance of the first 20 members of the
# sqgturb EnKF background ensemble (sqg_enstest.nc), "crossed" multiscale strategy:
#   B = U U^T, U = sum_s diag(G_s x_e) L_s^1/2, with a control vector shared by the scales
#   (cross-scale covariances included, Buehner and Shlyaeva 2015).
# Set up as the sqgturb experiment it is compared with: sharp scale separation at total
# wavenumber 20 (cycles per domain; wavelength 1000 km in SQG units, 178 km on the patch),
# large scales (total wavenumber <= 20) localized with a GC99 support of 3600 km and small
# scales (the residual, including the wavenumbers beyond the bi-Fourier truncation at 31) with
# 1200 km, in SQG units (times 0.17792 on the patch: 640.5 km and 213.5 km). With a sharp
# cutoff the responses are 0 or 1, so the scales sum to the perturbation (as "crossed" needs)
# and so do their squared responses (as "separated" needs).
# Run from build/ijedi/test with 1 MPI task (SQG files are written on a single task):
#   ijedi.x errortoolbox <this yaml>
# after splitting the ensemble file (sqgturb EnKF output, not in the repository) into members:
#   ../../../sqg-dirac/split_sqg_ensemble.py sqg_enstest.nc sqg-dirac
# The SQG domain is the doubly periodic 64x64 equatorial lon/lat patch of the SQG tests
# (0.5 deg spacing, period 32 deg = 3558 km in both directions); one SQG grid cell (312.5 km)
# is 55.6 km on the patch, i.e. SQG lengths times 0.178. Level 1 is the lower boundary, level 2
# the lid.
geometry:
  geometry_type: atlas
  nlevels: 2
  levels are top down: false
  vertical coordinate source: level index
  function space: StructuredColumns
  partitioner: checkerboard
  grid:
    type: regional
    nx: 64
    ny: 64
    west: 0.0
    east: 31.5
    south: -15.75
    north: 15.75

background:
  date: 2015-01-01T00:00:00Z
  state variables: [air_potential_temperature]
  io:
    filetype: sqg
    filename: sqg-dirac/sqg_ens_mean.nc
    time index: 0

background error:
  covariance model: SABER
  covariance type: ensemble
  adjoint test: true
  square-root test: true
  ensemble:
    members from template:
      template:
        date: 2015-01-01T00:00:00Z
        state variables: [air_potential_temperature]
        io:
          filetype: sqg
          filename: sqg-dirac/ens/sqg_ens_mem%mem%.nc
          time index: 0
      pattern: '%mem%'
      nmembers: 20
      zero padding: 3
  # Vertical length-scale 10 (levels): localization gc99(0.1) = 0.94 between the lower
  # boundary and the lid.
  scales:
  - filter:  # low-pass, response 1 up to total wavenumber 20 and 0 beyond (next is 20.02)
    - saber block name: BifourierGridToSpectral
    - saber block name: BifourierAnalyticalFilter
      waveband peak: 20.0
      waveband max: 20.001
      active variables: [air_potential_temperature]
    - saber block name: BifourierSpectralToGrid
    output:
      only first perturbation: true
      model write:
        io:
          filetype: sqg
          filename: sqg-dirac/sdl20-crossed-pert-large-mem%MEM%.nc
        member pattern: '%MEM%'
    localization:  # GC99 support 3600 km in SQG units
      saber central block:
        saber block name: BifourierCovariance
        profiles:
        - variable: air_potential_temperature
          horizontal length-scales: [640.5e3, 640.5e3]
          vertical length-scale: 10.0
      saber outer blocks:
      - saber block name: BifourierSpectralToGrid
  - output:  # small scales: residual
      only first perturbation: true
      model write:
        io:
          filetype: sqg
          filename: sqg-dirac/sdl20-crossed-pert-small-mem%MEM%.nc
        member pattern: '%MEM%'
    localization:  # GC99 support 1200 km in SQG units
      saber central block:
        saber block name: BifourierCovariance
        profiles:
        - variable: air_potential_temperature
          horizontal length-scales: [213.5e3, 213.5e3]
          vertical length-scale: 10.0
      saber outer blocks:
      - saber block name: BifourierSpectralToGrid
  multiscale strategy: crossed

# Domain centre, lower boundary
dirac:
  lon: [16.0]
  lat: [0.25]
  level: [1]
  variable: [air_potential_temperature]

output dirac:
  io:
    filetype: sqg
    filename: sqg-dirac/dirac-sdl20-crossed%id%.nc
